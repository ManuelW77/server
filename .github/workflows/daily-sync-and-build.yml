name: Daily Sync and Build

# Fork-only automation: merges upstream music-assistant/server (dev) and
# music-assistant/frontend (main) into the fork's feature branches every day
# and, if both merges succeed cleanly, triggers a fresh "nightly" test image
# build. Never intended to be merged into music-assistant/server.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/music-assistant/server.git

      - name: Fast-forward dev from upstream
        run: |
          set -euo pipefail
          git fetch upstream dev
          git checkout dev
          git merge --ff-only upstream/dev
          git push origin dev

      - name: Merge dev into feature branch
        run: |
          set -euo pipefail
          git checkout feat/library-automations-plugin
          git merge dev --no-edit

      - name: Push feature branch
        run: git push origin feat/library-automations-plugin

  sync-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          repository: ManuelW77/frontend
          fetch-depth: 0
          token: ${{ secrets.FRONTEND_PUSH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/music-assistant/frontend.git

      - name: Fast-forward main from upstream
        run: |
          set -euo pipefail
          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Merge main into feature branch
        run: |
          set -euo pipefail
          git checkout feat/library-automations-ui
          git merge main --no-edit

      - name: Push feature branch
        run: git push origin feat/library-automations-ui

  trigger-build:
    needs: [sync-server, sync-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nightly test image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-test-image.yml \
            -R ${{ github.repository }} \
            --ref test/docker-image \
            -f server_ref=feat/library-automations-plugin \
            -f frontend_ref=feat/library-automations-ui \
            -f tag=nightly
