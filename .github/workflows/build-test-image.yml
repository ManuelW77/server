name: Build Test Image

# Fork-only helper workflow: builds a combined server+frontend Docker test image from
# arbitrary branches and pushes it to this fork's GHCR namespace. Not part of the
# upstream project; never intended to be merged into music-assistant/server.

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: "Server branch/ref to build"
        required: true
        default: "feat/library-automations-plugin"
      frontend_ref:
        description: "Frontend branch/ref to build (music-assistant frontend fork)"
        required: true
        default: "feat/library-automations-ui"
      tag:
        description: "Image tag"
        required: true
        default: "test"

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE_VERSION: "1.6.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out server
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.server_ref }}

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: ManuelW77/frontend
          ref: ${{ inputs.frontend_ref }}
          path: frontend-src

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend-src/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build frontend wheel
        id: frontend_wheel
        working-directory: frontend-src
        run: |
          set -euo pipefail
          python3 -m pip install build
          python3 -m build

          frontend_wheel=$(basename dist/music_assistant_frontend-*-py3-none-any.whl)
          frontend_version=$(echo "$frontend_wheel" | sed -E 's/^music_assistant_frontend-(.+)-py3-none-any\.whl$/\1/')

          echo "frontend_wheel=${frontend_wheel}" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${frontend_version}" >> "$GITHUB_OUTPUT"
          echo "Frontend wheel: ${frontend_wheel}"
          echo "Frontend version: ${frontend_version}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Pin server dependency to the local frontend build
        env:
          FRONTEND_VERSION: ${{ steps.frontend_wheel.outputs.frontend_version }}
        run: |
          set -euo pipefail
          # The server wheel's own metadata pins music-assistant-frontend to an exact PyPI
          # version. If that pin doesn't match what we just built, the Dockerfile's second
          # `uv pip install music-assistant@...` step (which resolves that pin) silently
          # uninstalls our local frontend wheel and re-downloads the official PyPI release
          # instead, discarding all our frontend changes without any build error.
          sed -E -i "s|^([[:space:]]*)\"music-assistant-frontend==[^\"]*\",|\1\"music-assistant-frontend==${FRONTEND_VERSION}\",|" pyproject.toml
          grep "music-assistant-frontend==" pyproject.toml

      - name: Build server wheel
        run: |
          python3 -m pip install build
          python3 -m build

      - name: Assemble build context
        id: assemble
        env:
          FRONTEND_WHEEL: ${{ steps.frontend_wheel.outputs.frontend_wheel }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "frontend-src/dist/${FRONTEND_WHEEL}" dist/

          server_wheel=$(basename dist/music_assistant-*-py3-none-any.whl)
          mass_version=$(echo "$server_wheel" | sed -E 's/^music_assistant-(.+)-py3-none-any\.whl$/\1/')

          # Point requirements_all.txt at the freshly built local frontend wheel instead of
          # the pinned PyPI release. Runner-local edit only, never committed.
          sed -E -i "s|^music-assistant-frontend==.*|./dist/${FRONTEND_WHEEL}|" requirements_all.txt

          echo "mass_version=${mass_version}" >> "$GITHUB_OUTPUT"
          echo "Server wheel: ${server_wheel}"
          echo "Frontend wheel: ${FRONTEND_WHEEL}"
          echo "MASS_VERSION: ${mass_version}"

      - name: Compute lowercase image owner
        id: owner
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MASS_VERSION=${{ steps.assemble.outputs.mass_version }}
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
          tags: ghcr.io/${{ steps.owner.outputs.lower }}/server:${{ inputs.tag }}

      - name: Summary
        env:
          IMAGE_REF: ghcr.io/${{ steps.owner.outputs.lower }}/server:${{ inputs.tag }}
          SERVER_REF: ${{ inputs.server_ref }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          MASS_VERSION: ${{ steps.assemble.outputs.mass_version }}
        run: |
          {
            echo "### Test image built"
            echo ""
            echo "\`\`\`"
            echo "docker pull $IMAGE_REF"
            echo "\`\`\`"
            echo ""
            echo "- server ref: \`$SERVER_REF\`"
            echo "- frontend ref: \`$FRONTEND_REF\`"
            echo "- MASS_VERSION: \`$MASS_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
